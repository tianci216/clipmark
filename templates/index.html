<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0e0d0b;
  --bg-surface: #181714;
  --bg-card: #1f1d19;
  --bg-elevated: #29261f;
  --border: #342f26;
  --border-subtle: #2a261f;
  --text-primary: #ede8df;
  --text-secondary: #a9a294;
  --text-muted: #6b6560;
  --accent: #d4a04a;
  --accent-dim: #b8892f;
  --accent-glow: rgba(212, 160, 74, 0.12);
  --accent-hover: #e4b45a;
  --danger: #c75d4a;
  --tag-bg: rgba(212, 160, 74, 0.1);
  --tag-border: rgba(212, 160, 74, 0.25);
  --radius: 8px;
  --radius-sm: 5px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "DM Sans", system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 280px 1fr;
  overflow: hidden;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ========== Header ========== */
header {
  grid-column: 1 / -1;
  background: var(--bg-surface);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 24px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 10;
}

header::after {
  content: "";
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 6px;
  white-space: nowrap;
}

.logo h1 {
  font-family: "Instrument Serif", Georgia, serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: 0.02em;
}

.logo span {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
}

#search-input {
  margin-left: auto;
  width: 260px;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: "DM Sans", system-ui, sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color var(--transition);
}

#search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

#search-input::placeholder { color: var(--text-muted); }

/* ========== Buttons ========== */
button {
  padding: 7px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  font-family: "DM Sans", system-ui, sans-serif;
  font-size: 13px;
  font-weight: 500;
  background: var(--bg-card);
  color: var(--text-secondary);
  transition: all var(--transition);
  white-space: nowrap;
}

button:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border-color: var(--text-muted);
}

button:active { transform: scale(0.97); }

button.accent {
  background: var(--accent);
  color: var(--bg-deep);
  border-color: var(--accent);
  font-weight: 600;
}

button.accent:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

button.sm {
  padding: 3px 10px;
  font-size: 11px;
  border-radius: var(--radius-sm);
}

button.danger-sm {
  padding: 3px 10px;
  font-size: 11px;
  border-radius: var(--radius-sm);
  color: var(--danger);
  border-color: transparent;
  background: transparent;
}

button.danger-sm:hover {
  background: rgba(199, 93, 74, 0.1);
  border-color: rgba(199, 93, 74, 0.3);
}

button.mark-btn {
  padding: 7px 14px;
  border: 1px dashed var(--border);
  background: transparent;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  letter-spacing: 0.02em;
}

button.mark-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-glow);
}

/* ========== Sidebar ========== */
#sidebar-wrapper {
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  overflow: hidden;
}

#sidebar-toolbar {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

#sidebar {
  overflow-y: auto;
  padding: 12px;
  font-size: 13px;
  flex: 1;
  animation: slideIn 0.4s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-12px); }
  to { opacity: 1; transform: translateX(0); }
}

#sidebar details { margin-left: 2px; margin-bottom: 2px; }

#sidebar details[open] > summary {
  color: var(--text-primary);
}

#sidebar summary {
  cursor: pointer;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  user-select: none;
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.01em;
  transition: all var(--transition);
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

#sidebar summary::before {
  content: "";
  display: inline-block;
  width: 5px;
  height: 5px;
  border-right: 1.5px solid var(--text-muted);
  border-bottom: 1.5px solid var(--text-muted);
  transform: rotate(-45deg);
  transition: transform var(--transition);
  flex-shrink: 0;
}

#sidebar details[open] > summary::before {
  transform: rotate(45deg);
}

#sidebar summary:hover { background: var(--bg-elevated); color: var(--text-primary); }
#sidebar ul { list-style: none; margin-left: 12px; }

#sidebar .video-item {
  padding: 5px 10px;
  cursor: pointer;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12px;
  color: var(--text-secondary);
  transition: all var(--transition);
  margin: 1px 0;
}

#sidebar .video-item:hover {
  background: var(--accent-glow);
  color: var(--accent);
}

#sidebar .video-item.active {
  background: var(--accent-glow);
  color: var(--accent);
  font-weight: 500;
  border-left: 2px solid var(--accent);
  padding-left: 8px;
}

/* ========== Main Area ========== */
#main {
  overflow-y: auto;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== Video ========== */
video {
  width: 100%;
  max-height: 58vh;
  background: #000;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

#no-video {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 340px;
  color: var(--text-muted);
  font-size: 14px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  gap: 12px;
  animation: fadeUp 0.6s ease;
}

#no-video::before {
  content: "PLAY";
  font-family: "Instrument Serif", Georgia, serif;
  font-size: 48px;
  color: var(--border);
  letter-spacing: 0.15em;
}

/* ========== Controls ========== */
#controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  padding: 14px 18px;
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid var(--border-subtle);
  animation: fadeUp 0.5s ease 0.1s both;
}

#controls .time-display {
  font-family: "JetBrains Mono", monospace;
  font-size: 14px;
  font-weight: 500;
  color: var(--accent);
  min-width: 48px;
  text-align: center;
}

.time-separator {
  color: var(--text-muted);
  font-size: 12px;
  margin: 0 2px;
}

#controls input[type="text"],
#controls textarea {
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: "DM Sans", system-ui, sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color var(--transition);
}

#controls input[type="text"]:focus,
#controls textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

#controls input::placeholder,
#controls textarea::placeholder { color: var(--text-muted); }

#tags-input { width: 200px; }
#note-input {
  width: 260px;
  resize: none;
  height: 34px;
  font-family: "DM Sans", system-ui, sans-serif;
}

/* ========== Clips Section ========== */
#clips-section {
  animation: fadeUp 0.5s ease 0.2s both;
}

#clips-section h3 {
  font-family: "Instrument Serif", Georgia, serif;
  font-size: 16px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-bottom: 10px;
  letter-spacing: 0.02em;
}

.clip-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--bg-card);
  border-radius: var(--radius);
  margin-bottom: 6px;
  font-size: 13px;
  border: 1px solid transparent;
  transition: all var(--transition);
}

.clip-card:hover {
  border-color: var(--border);
  background: var(--bg-elevated);
}

.clip-time {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
  cursor: pointer;
  white-space: nowrap;
  transition: color var(--transition);
}

.clip-time:hover {
  color: var(--accent-hover);
  text-decoration: none;
}

.clip-time-sep { color: var(--text-muted); font-size: 11px; margin: 0 1px; }

.clip-tags { display: flex; gap: 5px; flex-wrap: wrap; }

.tag-badge {
  background: var(--tag-bg);
  border: 1px solid var(--tag-border);
  color: var(--accent);
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.clip-note {
  color: var(--text-muted);
  font-size: 12px;
  flex: 1;
  font-style: italic;
}

.clip-actions { margin-left: auto; opacity: 0; transition: opacity var(--transition); }
.clip-card:hover .clip-actions { opacity: 1; }

/* ========== Search Results ========== */
#search-results {
  display: none;
  position: absolute;
  top: 100%;
  right: 24px;
  width: 360px;
  max-height: 70vh;
  overflow-y: auto;
  background: var(--bg-card);
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 16px 18px;
  border: 1px solid var(--border-subtle);
  border-top: none;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  z-index: 20;
  animation: fadeUp 0.3s ease;
}

#search-results h3 {
  font-family: "Instrument Serif", Georgia, serif;
  font-size: 16px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.search-result {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-bottom: 4px;
  font-size: 13px;
  transition: all var(--transition);
  border: 1px solid transparent;
}

.search-result:hover {
  background: var(--bg-elevated);
  border-color: var(--border);
}

.search-result .sr-file {
  color: var(--text-muted);
  font-size: 11px;
  margin-top: 4px;
}



/* ========== Empty State ========== */
.empty-state {
  color: var(--text-muted);
  font-size: 13px;
  font-style: italic;
  padding: 4px 0;
}

/* ========== Responsive ========== */
@media (max-width: 800px) {
  body { grid-template-columns: 1fr; }
  #sidebar-wrapper { display: none; }
#main { padding: 16px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <h1>Clipmark</h1>
    <span>dance archive</span>
  </div>
  <input type="text" id="search-input" placeholder="Search by tag..." onkeydown="if(event.key==='Enter')searchClips()">
  <div id="search-results">
    <h3>Search Results</h3>
    <div id="results-list"></div>
  </div>
</header>

<div id="sidebar-wrapper">
  <div id="sidebar-toolbar">
    <button onclick="refreshTree()" title="Rescan video folder" class="sm" style="width:100%">Refresh</button>
  </div>
  <div id="sidebar"></div>
</div>

<div id="main">
  <div id="no-video">Select a video from the sidebar</div>
  <video id="player" controls style="display:none"></video>

  <div id="controls" style="display:none">
    <button class="mark-btn" onclick="markStart()">IN</button>
    <span id="start-display" class="time-display">--:--</span>
    <span class="time-separator">&rarr;</span>
    <button class="mark-btn" onclick="markEnd()">OUT</button>
    <span id="end-display" class="time-display">--:--</span>
    <input type="text" id="tags-input" placeholder="Tags (comma-separated)">
    <textarea id="note-input" placeholder="Note..."></textarea>
    <button class="accent" onclick="saveClip()">Save Clip</button>
  </div>

  <div id="clips-section" style="display:none">
    <h3>Saved Clips</h3>
    <div id="clips-list"></div>
  </div>
</div>


<script>
let currentVideoPath = null;
let currentVideoHash = null;
let clipStart = null;
let clipEnd = null;
let allAnnotations = { videos: [] };

const player = document.getElementById("player");
const sidebar = document.getElementById("sidebar");

function encodePath(p) {
  return p.split("/").map(encodeURIComponent).join("/");
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function parseTime(str) {
  const parts = str.split(":");
  return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

// --- Tree ---
function renderTree(node, parentEl) {
  if (node.children.length === 0 && node.videos.length === 0) return;
  const details = document.createElement("details");
  const summary = document.createElement("summary");
  summary.textContent = node.name;
  details.appendChild(summary);
  node.children.forEach(child => renderTree(child, details));
  if (node.videos.length) {
    const ul = document.createElement("ul");
    node.videos.forEach(v => {
      const li = document.createElement("li");
      li.textContent = v.name;
      li.className = "video-item";
      li.title = v.path;
      li.dataset.path = v.path;
      li.dataset.hash = v.hash;
      li.onclick = () => loadVideo(v.path, v.hash);
      ul.appendChild(li);
    });
    details.appendChild(ul);
  }
  parentEl.appendChild(details);
}

// --- Video ---
function loadVideo(path, hash) {
  currentVideoPath = path;
  currentVideoHash = hash;
  clipStart = null;
  clipEnd = null;
  document.getElementById("start-display").textContent = "--:--";
  document.getElementById("end-display").textContent = "--:--";
  document.getElementById("tags-input").value = "";
  document.getElementById("note-input").value = "";

  document.getElementById("no-video").style.display = "none";
  player.style.display = "block";
  document.getElementById("controls").style.display = "flex";
  document.getElementById("clips-section").style.display = "block";

  player.src = "/video/" + encodePath(path);
  player.load();

  document.querySelectorAll(".video-item").forEach(el => {
    el.classList.toggle("active", el.dataset.path === path);
  });

  renderClips();
}

// --- Clip marking ---
function markStart() {
  if (!currentVideoPath) return;
  clipStart = player.currentTime;
  document.getElementById("start-display").textContent = formatTime(clipStart);
}

function markEnd() {
  if (!currentVideoPath) return;
  clipEnd = player.currentTime;
  document.getElementById("end-display").textContent = formatTime(clipEnd);
}

async function saveClip() {
  if (clipStart === null || clipEnd === null) {
    alert("Mark both start and end times first.");
    return;
  }
  const tags = document.getElementById("tags-input").value
    .split(",").map(t => t.trim()).filter(Boolean);
  const note = document.getElementById("note-input").value.trim();

  await fetch("/api/annotations", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      hash: currentVideoHash,
      file: currentVideoPath,
      clip: { start: formatTime(clipStart), end: formatTime(clipEnd), tags, note }
    })
  });

  await loadAnnotations();
  renderClips();

  clipStart = null;
  clipEnd = null;
  document.getElementById("start-display").textContent = "--:--";
  document.getElementById("end-display").textContent = "--:--";
  document.getElementById("tags-input").value = "";
  document.getElementById("note-input").value = "";
}

async function deleteClip(hash, index) {
  await fetch("/api/annotations", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ hash, clip_index: index })
  });
  await loadAnnotations();
  renderClips();
}

// --- Clips display ---
function renderClips() {
  const list = document.getElementById("clips-list");
  list.innerHTML = "";
  const entry = allAnnotations.videos.find(v => v.hash === currentVideoHash);
  if (!entry || !entry.clips.length) {
    list.innerHTML = '<div class="empty-state">No clips saved yet</div>';
    return;
  }
  entry.clips.forEach((clip, i) => {
    const card = document.createElement("div");
    card.className = "clip-card";
    card.innerHTML = `
      <span class="clip-time" onclick="seekTo('${clip.start}')">${clip.start}</span>
      <span class="clip-time-sep">&rarr;</span>
      <span class="clip-time" onclick="seekTo('${clip.end}')">${clip.end}</span>
      <div class="clip-tags">${(clip.tags||[]).map(t => `<span class="tag-badge">${esc(t)}</span>`).join("")}</div>
      <span class="clip-note">${esc(clip.note || "")}</span>
      <div class="clip-actions"><button class="danger-sm" onclick="deleteClip('${escAttr(entry.hash)}', ${i})">Remove</button></div>
    `;
    list.appendChild(card);
  });
}

function seekTo(timeStr) {
  player.currentTime = parseTime(timeStr);
  player.play();
}

// --- Search ---
async function searchClips() {
  const query = document.getElementById("search-input").value.trim();
  if (!query) return;
  const res = await fetch("/api/search?tag=" + encodeURIComponent(query));
  const results = await res.json();
  const container = document.getElementById("results-list");
  const section = document.getElementById("search-results");
  container.innerHTML = "";

  if (!results.length) {
    container.innerHTML = '<div class="empty-state">No matching clips found</div>';
    section.style.display = "block";
    return;
  }

  results.forEach(r => {
    const div = document.createElement("div");
    div.className = "search-result";
    div.innerHTML = `
      <span class="clip-time">${r.clip.start}</span>
      <span class="clip-time-sep">&rarr;</span>
      <span class="clip-time">${r.clip.end}</span>
      <div class="clip-tags" style="margin-top:4px">
        ${(r.clip.tags||[]).map(t => `<span class="tag-badge">${esc(t)}</span>`).join("")}
      </div>
      ${r.clip.note ? `<div class="clip-note" style="margin-top:2px">${esc(r.clip.note)}</div>` : ""}
      <div class="sr-file">${esc(r.file)}</div>
    `;
    div.onclick = () => {
      const sidebarItem = document.querySelector(`.video-item[data-hash="${r.hash}"]`);
      const path = sidebarItem ? sidebarItem.dataset.path : r.file;
      loadVideo(path, r.hash);
      setTimeout(() => seekTo(r.clip.start), 500);
    };
    container.appendChild(div);
  });
  section.style.display = "block";
}

function clearSearch() {
  document.getElementById("search-input").value = "";
  document.getElementById("search-results").style.display = "none";
}

// --- Helpers ---
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return s.replace(/'/g, "\\'").replace(/\\/g, "\\\\");
}

// --- Init ---
async function loadAnnotations() {
  const res = await fetch("/api/annotations");
  allAnnotations = await res.json();
}

async function refreshTree() {
  sidebar.innerHTML = "";
  const res = await fetch("/api/tree");
  const tree = await res.json();
  renderTree(tree, sidebar);
}

async function init() {
  const [treeRes] = await Promise.all([fetch("/api/tree"), loadAnnotations()]);
  const tree = await treeRes.json();
  renderTree(tree, sidebar);
}

document.addEventListener("click", e => {
  const results = document.getElementById("search-results");
  const input = document.getElementById("search-input");
  if (results.style.display === "block" && !results.contains(e.target) && e.target !== input) {
    results.style.display = "none";
  }
});

init();
</script>
</body>
</html>
